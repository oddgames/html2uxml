name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref to build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # Pack the repo root as a UPM tarball (npm-style) so consumers can install
  # offline or pin a specific version without going through Git.
  # -------------------------------------------------------------------------
  pack-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve package version and tag
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          tag="${GITHUB_REF_NAME}"
          if [ -z "$tag" ] || [ "$tag" = "main" ]; then
            tag="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=${name}"       >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"         >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v${{ steps.meta.outputs.version }}"
          actual="${GITHUB_REF_NAME}"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Tag $actual does not match package.json version (expected $expected)"
            exit 1
          fi

      - name: Build UPM tarball
        run: |
          mkdir -p dist
          # npm pack respects package.json's "files" and produces
          # <name>-<version>.tgz with a "package/" root inside.
          npm pack
          mv "${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.version }}.tgz" \
             "dist/${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.version }}.tgz"

      - uses: actions/upload-artifact@v4
        with:
          name: upm-tarball
          path: dist/

  # -------------------------------------------------------------------------
  # Publish to npmjs.com so Unity projects can install via a scoped registry.
  # Requires an NPM_TOKEN secret on the repo with publish access.
  # Runs only on tag pushes; skipped silently if the secret is not configured.
  # -------------------------------------------------------------------------
  publish-npm:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: pack-tarball
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Skip publish (no NPM_TOKEN secret)
        if: ${{ env.NPM_TOKEN == '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "NPM_TOKEN secret is not set; skipping npm publish."

  # -------------------------------------------------------------------------
  # Attach the UPM tarball to the GitHub Release with auto-generated notes.
  # -------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: pack-tarball
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: upm-tarball
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
